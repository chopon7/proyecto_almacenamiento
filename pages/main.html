<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="../assets/icons/Icono_logo.jpg">
    <title>Temu Drive - Main</title>

    <meta name="description"
        content="Temu Drive es un proyecto de almacenamiento en la nube que permite a los usuarios guardar, compartir y acceder a sus archivos.">
    <meta name="Author" content="Alfonso Jacobo Rodríguez García">
    <meta name="Author" content="Amukiri Romero Peláez">
    <meta name="Keywords" content="HTML, CSS, almacenamiento en la nube">
    <link rel="canonical" href="https://temudrive.com">

    <meta name="robots" content="index, follow">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Temu Drive">
    <meta name="twitter:description"
        content="Temu Drive es un proyecto de almacenamiento en la nube que permite a los usuarios guardar, compartir y acceder a sus archivos.">

    <meta property="og:title" content="Temu Drive">
    <meta property="og:description" content="Temu Drive es un proyecto de almacenamiento">
    <meta property="og:image"
        content="https://imgs.search.brave.com/LFUvWDowFZiyRemXTzSNoQZqHijRwnziYuDO23TvPWo/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9raW5z/dGEuY29tL3dwLWNv/bnRlbnQvdXBsb2Fk/cy8yMDIyLzA4L2Ns/b3VkLXN0b3JhZ2Ut/cHJvY2Vzcy1pbGx1/c3RyYXRpb24ucG5n">
    <meta property="og:url" content="https://temudrive.com">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="../css/main.css">

</head>

<body id="body">

    <!-- Barra de navegación, donde esta la barra de busqueda de archivos-->

    <header class="header">
        <!-- Icono de la empresa que va hasta la izquierda-->
        <div class="header__brand">
            <img class="header__logo-img" src="../assets/img/Icono_logo.webp" alt="Logo Temu Drive" width="50"
                height="50" loading="lazy">
            <h2 class="header__logo-text">Temu Drive</h2>
        </div>

        <!-- Barra de busqueda -->
        <div class="header__barra">
            <input class="header__barra--input" type="search" placeholder="¿Qué buscamos hoy?">
        </div>

        <!-- Botones de configuracion, cambio de tema y cuenta-->
        <div class="header__botones">
            <!-- Boton de cambiar de tema-->
            <button class="header__botones" type="button">
                <img class="header__botones-tema-img" src="../assets/icons/modo_oscuro.png" width="26" height="26"
                    alt="cambiar tema">
            </button>
            <!-- Boton de ir a configuracion-->
            <button class="header__botones" type="button">
                <img class="header__botones-configuracion-img" src="../assets/icons/icon_utils/Icono_ajustes.webp"
                    width="26" height="26" alt="cambiar tema">
            </button>
            <!-- Boton de informacion de cuenta -->
            <button class="header__botones" type="button">
                <img class="header__botones-cuenta-img" src="../assets/icons/icon_utils/Icono_ajustes.webp" width="26"
                    height="26" alt="cambiar tema">
            </button>
        </div>
    </header>

    <!-- Seccion del main donde se ven todos los archivos-->
    <main class="main">
        <!-- Nombre de la ruta-->
        <div class="main__slogan">
            <div>
                Mi unidad
            </div>
        </div>
        <div class="botones__vista">
            botones extra
        </div>
        <!-- plantilla donde se ve los archivos-->
        <section class="seccion">
            <h3 class="titulo__archivos">Archivos</h3>
            <div class="archivos">
                <!-- Estructura de la tarejta/forma del archivo individual-->
                <article class="archivo">
                    <!-- La parte de la cabecera, el titulo, img de referencia y botones de opcion-->
                    <div class="archivo__cabecera">
                        <img class="archivo__icono" src="../assets/icons/icon_format/Icono_Documento_Texto.webp" alt=""
                            width="20" height="20">
                        <span class="archivo__nombre" title="Reporte de usuarios.pdf">Reporte de usuarios.pdf</span>
                        <button class="boton-icono" type="button" aria-label="Más opciones">
                            <img class="icono" src="../assets/icons/icon_utils/Icono_mas_opciones.webp" alt=""
                                width="20" height="20">
                        </button>
                    </div>
                    <!-- Imagen central de la tarjeta-->
                    <div class="archivo__miniatura">
                        <img class="icono" src="../assets/icons/icon_format/Icono_Documento_Texto.webp" alt=""
                            width="100" height="100">
                    </div>
                    <!-- Pie de terjeta infominima y con estrellita de especial-->
                    <p class="archivo__pie">Tú · 30 oct 2026<span class="estrella">★</span></p>
                </article>

                <!-- 2da tarejata a crear-->
                <article class="archivo">
                    <!-- La parte de la cabecera, el titulo, img de referencia y botones de opcion-->
                    <div class="archivo__cabecera">
                        <img class="icono archivo__icono" src="../assets/icons/icon_format/Icono_Audio.webp" alt=""
                            width="20" height="20">
                        <span class="archivo__nombre" title="Reporte de usuarios.pdf">Jose jose musica chida.wap</span>
                        <button class="boton-icono" type="button" aria-label="Más opciones">
                            <img class="icono" src="../assets/icons/icon_utils/Icono_mas_opciones.webp" alt=""
                                width="20" height="20">
                        </button>
                    </div>
                    <!-- Imagen central de la tarjeta-->
                    <div class="archivo__miniatura">
                        <img class="icono" src="../assets/icons/icon_format/Icono_Audio.webp" alt="" width="100"
                            height="100">
                    </div>
                    <!-- Pie de terjeta infominima-->
                    <p class="archivo__pie">Tú · 30 oct 2026</span></p>
                </article>

                <!-- 3ra tarjeta-->
                <article class="archivo">
                    <!-- La parte de la cabecera, el titulo, img de referencia y botones de opcion-->
                    <div class="archivo__cabecera">
                        <img class="icono archivo__icono" src="../assets/icons/icon_format/Icono_Documento_Texto.webp"
                            alt="" width="20" height="20">
                        <span class="archivo__nombre" title="Reporte de usuarios.pdf">Reporte de usuarios.pdf</span>
                        <button class="boton-icono" type="button" aria-label="Más opciones">
                            <img class="icono" src="../assets/icons/icon_utils/Icono_mas_opciones.webp" alt=""
                                width="20" height="20">
                        </button>
                    </div>
                    <!-- Imagen central de la tarjeta-->
                    <div class="archivo__miniatura">
                        <img class="icono" src="../assets/icons/icon_format/Icono_Documento_Texto.webp" alt=""
                            width="100" height="100">
                    </div>
                    <!-- Pie de terjeta infominima-->
                    <p class="archivo__pie">Tú · 30 oct 2026</p>
                </article>
            </div>

        </section>
    </main>
    <script src="main.js"></script>
</body>

</html>
