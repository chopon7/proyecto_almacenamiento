<!DOCTYPE html>
<html lang="en">

<!-- Head con información basica COMPLETADO-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="../assets/icons/Icono_logo.jpg">
    <title>Temu Drive - Main</title>

    <meta name="description"
        content="Temu Drive es un proyecto de almacenamiento en la nube que permite a los usuarios guardar, compartir y acceder a sus archivos.">
    <meta name="Author" content="Alfonso Jacobo Rodríguez García">
    <meta name="Author" content="Amukiri Romero Peláez">
    <meta name="Keywords" content="HTML, CSS, almacenamiento en la nube">
    <link rel="canonical" href="https://temudrive.com">

    <meta name="robots" content="index, follow">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Temu Drive">
    <meta name="twitter:description"
        content="Temu Drive es un proyecto de almacenamiento en la nube que permite a los usuarios guardar, compartir y acceder a sus archivos.">

    <meta property="og:title" content="Temu Drive">
    <meta property="og:description" content="Temu Drive es un proyecto de almacenamiento">
    <meta property="og:image"
        content="https://imgs.search.brave.com/LFUvWDowFZiyRemXTzSNoQZqHijRwnziYuDO23TvPWo/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9raW5z/dGEuY29tL3dwLWNv/bnRlbnQvdXBsb2Fk/cy8yMDIyLzA4L2Ns/b3VkLXN0b3JhZ2Ut/cHJvY2Vzcy1pbGx1/c3RyYXRpb24ucG5n">
    <meta property="og:url" content="https://temudrive.com">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="../css/main.css">

</head>


<!-- cuerpo principal 
 TODO: agregar diseño completo del main y javscriprt-->

<body id="body">

    <!-- Barra de navegación, donde esta la barra de busqueda de archivos-->

    <header class="header">
        <!-- Icono de la empresa que va hasta la izquierda-->
        <div class="header__brand">
            <img class="header__logo-img" src="../assets/img/Icono_logo.webp" alt="Logo Temu Drive" width="50"
                height="50" loading="lazy">
            <h2 class="header__logo-text">Temu Drive</h2>
        </div>

        <!-- Barra de busqueda -->
        <div class="header__barra">
            <input class="header__barra--input" type="search" placeholder="¿Qué buscamos hoy?">
            <button class="header__barra-boton" type="button">
                <img class="header__boton--img" src="../assets/icons/icon_utils/Icono_buscar.webp" width="26"
                    height="26" alt="buscar">
            </button>
        </div>

        <!-- Botones de configuracion, cambio de tema y cuenta-->
        <div class="header__botones">
            <!-- Boton de cambiar de tema-->
            <button class="header__theme" type="button" aria-expanded="false" aria-label="Cuenta">
                <img class="header__theme-img" src="../assets/icons/modo_claro.png" width="26" height="26"
                    alt="cambiar tema">
            </button>

            <!-- Boton de informacion de cuenta (contiene  configuracion adentro)-->
            <div class="header__cuenta">
                <button class="header__cuenta-boton" type="button">
                    <img class="header__boton--img" src="../assets/icons/icon_utils/Icono_usuario.webp" width="26"
                        height="26" alt="cuenta">
                </button>
                <div class="header__cuenta-opciones">
                    <ul class="header__cuenta-lista">
                        <li class="header__cuenta-item"><a class="header__cuenta-link" href="#">Configuración</a></li>
                        <li class="header__cuenta-item"><a class="header__cuenta-link" href="#">Cerrar sesión</a></li>
                    </ul>
                </div>
            </div>



            <!-- Panel de opciones al hacer clic en el botón de cuenta-->

        </div>
    </header>

    <!-- Seccion del main donde se ven todos los archivos-->
    <main class="main">
        <!-- Nombre de la ruta-->
        <section class="main__slogan">
            <div>
                Mi unidad
            </div>
        </section>

        <!-- Seccion de botones para la vista de los archivos-->
        <section class="botones__vista">
            <button class="boton-icono" type="button" aria-label="Vista de cuadricula">
                <img class="icono" src="../assets/icons/icon_utils/Icono_vista_cuadricula.webp" alt="" width="20"
                    height="20">
            </button>

            <button class="boton-icono" type="button" aria-label="Vista de lista">
                <img class="icono" src="../assets/icons/icon_utils/Icono_vista_lista.webp" alt="" width="20"
                    height="20">
            </button>
        </section>

        <!-- plantilla donde se ve los archivos-->
        <section class="seccion">
            <h3 class="titulo__archivos">Mis Archivos</h3>
            <p class="estao" role="status" aria-live="polite"></p>
            <div class="archivos"></div>

        </section>
    </main>
    <script src="../node_modules/sweetalert2/dist/sweetalert2.all.min.js"></script>
    <script src="../js/archivos.js"></script>
</body>

</html>
