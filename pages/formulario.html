<!DOCTYPE html>
<html lang="es">

<!-- Head con información basica COMPLETADO-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="canonical" href="https://temudrive/register">

    <link rel="icon" type="image/jpeg" href="../assets/icons/Icono_logo.jpg">
    <title>Temu Drive - Registro</title>

    <meta name="description"
        content="Regístrate en Temu Drive, la mejor web para almacenar tus archivos en la nube de manera segura y confiable.">
    <meta name="Keywords" content="HTML, CSS, almacenamiento en la nube">
    <meta name="robots" content="noindex, nofollow">

    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/formulario-usuario.css">
</head>

<!-- cuerpo principal 
TODO: Cambiar icono de tema principal.
TODO: Cambiar nombres de "modalidad" por nombre de paquetes
TOOO; OPCIONAL fondo de pantalla especial. 
-->

<body id="body" class="layout">
    <!-- Header  -->
    <header class="header">
        <a class="header__brand" href="../index.html">
            <img class="header__logo-img" src="../assets/img/Icono_logo.webp" alt="" width="50" height="50">
            <span class="header__logo-text">Temu Drive</span>
        </a>

        <nav class="header__nav" id="menu-principal" aria-label="Principal">
            <ul class="header__list">
                <li class="header__item"><a class="header__link" href="ofertas-y-paquetes.html">Paquetes</a></li>
                <li class="header__item"><a class="header__link" href="soporte.html">Soporte</a></li>
                <li class="header__item"><a class="header__link" href="informacion.html">Más información</a></li>
            </ul>
        </nav>

        <button class="header__theme" type="button" aria-label="Cambiar a tema claro">
            <img class="header__theme-img" src="../assets/icons/modo_claro.png" alt="" width="26" height="26">
        </button>

        <button class="header__burger" type="button" aria-label="Abrir menú" aria-expanded="false"
            aria-controls="menu-principal">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </header>

    <!-- Main -->
    <main class="main">
        <section class="formulario">
            <h2 class="formulario-h2">Registro de usuario</h2>

            <form id="formulario" action="/receptor-formulario" method="post" enctype="multipart/form-data" novalidate>

                <section class="formulario__grupo">
                    <label class="formulario-label" for="nombre_usuario">Nombre</label>
                    <input class="formulario-input" name="nombre_usuario" id="nombre_usuario" type="text"
                        placeholder="Nombre de usuario" required autofocus>
                    <span class="error-campo" data-error-para="nombre_usuario"></span>
                </section>

                <section class="formulario__grupo">
                    <label class="formulario-label" for="contrasenia">Contraseña</label>
                    <input class="formulario-input" name="contrasenia" id="contrasenia" type="password"
                        placeholder="Más de 8 caracteres" required minlength="8">
                    <span class="error-campo" data-error-para="contrasenia"></span>
                </section>

                <section class="formulario__grupo">
                    <label class="formulario-label" for="correo">Correo electrónico</label>
                    <input class="formulario-input" name="correo" id="correo" type="email"
                        placeholder="ejemplo@correo.com" required>
                    <span class="error-campo" data-error-para="correo"></span>
                </section>

                <section class="formulario__radios">
                    <h3 class="formulario-h3">Modalidad</h3>
                    <div class="radio-group">
                        <label class="radio-item" for="rad-basico">
                            <input type="radio" id="rad-basico" name="plan" value="basico" checked>
                            Básico
                        </label>
                        <label class="radio-item" for="rad-seguro">
                            <input type="radio" id="rad-seguro" name="plan" value="pro">
                            Pro
                        </label>
                        <label class="radio-item" for="rad-personalizado">
                            <input type="radio" id="rad-personalizado" name="plan" value="master">
                            Master
                        </label>
                        <span class="error-campo" data-error-para="plan"></span>
                    </div>
                </section>

                <section class="formulario__grupo">
                    <label class="checkbox-item" for="terminos_aceptados">
                        <input name="terminos_aceptados" id="terminos_aceptados" type="checkbox" required
                            value="aceptado">
                        Acepto términos y condiciones
                    </label>
                    <span class="error-campo" data-error-para="terminos_aceptados"></span>
                </section>

                <p class="mensaje" id="estado-usuarios"></p>

                <section class="formulario__acciones">
                    <button class="formulario-botton formulario-botton--primary" type="submit">Crear cuenta</button>
                    <button class="formulario-botton formulario-botton--secondary" type="reset">Cancelar</button>
                </section>

            </form>
        </section>

    </main>

    <script type="module" src="../js/main.js" defer></script>
</body>

</html>
